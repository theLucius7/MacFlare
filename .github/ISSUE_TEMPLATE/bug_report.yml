name: 问题报告 / Bug report
description: 报告可复现的采集、上传、API 或文档问题。
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        请先查看故障排查文档。不要粘贴令牌、完整私有配置或真实个人快照。
        涉及安全漏洞请使用 [私密漏洞报告](https://github.com/xw7qwq/macflare/security/advisories/new)，不要填写公开问题报告。
  - type: input
    id: version
    attributes:
      label: MacFlare 版本或提交号
      placeholder: 版本号或 git rev-parse --short HEAD 的输出
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 本机问题填写 macOS 版本与 Apple Silicon/Intel；只涉及文档可填不适用。
      placeholder: macOS 版本、芯片；相关 Node/Wrangler 版本（如适用）
    validations:
      required: true
  - type: dropdown
    id: execution
    attributes:
      label: 问题发生位置
      options:
        - 手动运行 Mac Agent
        - launchd 后台运行
        - Cloudflare 部署或 API
        - 文档或网页
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 提供最小步骤；说明手动与后台的结果是否不同。
      placeholder: |
        1. 使用哪些非敏感配置…
        2. 执行什么操作…
        3. 观察到什么结果…
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期行为与实际行为
      description: 包含 HTTP 状态码或简短错误；不要附带真实应用或歌曲列表。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏诊断与已尝试的排查（可选）
      description: 只提供相关片段；删除 Authorization、令牌、个人域名及其他不必要的个人信息。
