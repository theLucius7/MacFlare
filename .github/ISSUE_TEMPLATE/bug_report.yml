name: Bug report
description: Report a reproducible collection, upload, API, or documentation problem.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        Read the troubleshooting documentation first. Do not paste tokens, complete private configuration, or real personal snapshots.
        For security vulnerabilities, use [private vulnerability reporting](https://github.com/xw7qwq/macflare/security/advisories/new) instead of this public bug report.
  - type: input
    id: version
    attributes:
      label: MacFlare version or commit
      placeholder: Version number or the output of git rev-parse --short HEAD
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: For local issues, include the macOS version and Apple Silicon/Intel. Use N/A for documentation-only issues.
      placeholder: macOS version and chip; relevant Node/Wrangler versions, if applicable
    validations:
      required: true
  - type: dropdown
    id: execution
    attributes:
      label: Where the problem occurs
      options:
        - Manual Mac Agent execution
        - Background execution through launchd
        - Cloudflare deployment or API
        - Documentation or website
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide minimal steps and explain whether manual and background results differ.
      placeholder: |
        1. Nonsensitive configuration used...
        2. Action performed...
        3. Result observed...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include HTTP status codes or brief errors, without real app or track lists.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted diagnostics and troubleshooting attempted (optional)
      description: Include only relevant excerpts. Remove Authorization, tokens, personal domains, and other unnecessary personal information.
