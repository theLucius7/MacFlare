name: Feature request
description: Explain the problem to solve and the expected behavior.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the use case and current limitation, rather than only listing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Expected behavior
      description: Give a concrete example of the change a user would see.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Privacy, dependency, and usage impact (if applicable)
      description: Note any new public fields, system permissions, runtime dependencies, or cloud requests. State uncertainties if needed.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
