<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">MacFlare 单向数据流</title>
  <desc id="desc">Mac 主动推送到 Worker，Worker 读写 KV。网页只查询 Worker，没有回连 Mac 的箭头。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="280" rx="12" fill="#f8fafc"/>
  <g fill="#fff" stroke="#cbd5e1"><rect x="20" y="30" width="180" height="80" rx="8"/><rect x="290" y="30" width="180" height="80" rx="8"/><rect x="560" y="30" width="180" height="80" rx="8"/><rect x="290" y="180" width="180" height="75" rx="8"/></g>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M200 70 H280"/><path d="M470 70 H550"/><path d="M380 180 V120"/></g>
  <g fill="#18334d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <g font-size="17" font-weight="600"><text x="110" y="60">macOS</text><text x="380" y="60">Cloudflare Worker</text><text x="650" y="60">Workers KV</text><text x="380" y="210">博客 / 状态页</text></g>
    <g font-size="14"><text x="110" y="87">原生采集与隐私过滤</text><text x="380" y="87">鉴权、校验与到期判断</text><text x="650" y="87">单键覆盖 · TTL</text><text x="380" y="235">GET /api/now</text><text x="240" y="53">主动推送</text><text x="510" y="53">读写</text><text x="430" y="153">只读查询</text></g>
  </g>
</svg>
